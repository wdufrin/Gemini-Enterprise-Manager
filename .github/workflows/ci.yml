name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on ESLint *errors*. Warnings are tolerated but ratcheted:
      # --max-warnings is a ceiling that should only ever be lowered.
      #
      # Current baseline: 442 warnings (mostly @typescript-eslint/no-explicit-any).
      # This ceiling was previously 1348 against an actual count of ~448, which
      # left ~900 warnings of headroom -- new warnings could accumulate
      # indefinitely without CI noticing. It is now set to the exact measured
      # count so that ANY new warning fails the build. When you legitimately
      # reduce the count, lower this number in the same PR.
      - name: Lint
        run: npm run lint -- --max-warnings 442


      # NOTE: tsconfig.json currently has "strict": false, so this check is
      # much weaker than it looks. Tightening it is tracked in Phase 2.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ADK Studio hands users Python to deploy. A syntax check is not enough --
  # `Agent(plugins=[...])` is syntactically perfect and only fails when pydantic
  # validates it at import. This job does the real import.
  codegen-import:
    name: ADK codegen import check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # These transitive deps are installed explicitly on purpose. The matrix
      # SKIPS any case whose import dies on a missing module -- which is how
      # the task 1.10 regression guard silently stopped running locally until
      # bigquery-storage and pyarrow were installed. Pinning them here keeps the
      # guard honest. Bump google-adk deliberately, not automatically.
      #
      # Dependencies required by ADK codegen templates during import validation.
      # ADK_IMPORT_STRICT below turns any omission into a failure instead of a
      # vacuous pass, so this list cannot silently rot.
      - name: Install ADK runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'google-adk==2.3.0' \
            'google-antigravity==0.1.3' \
            'google-cloud-bigquery' \
            'google-cloud-bigquery-storage' \
            'google-cloud-storage' \
            'google-cloud-monitoring' \
            'pyarrow' \
            'nest_asyncio' \
            'google-cloud-securitycenter' \
            'google-cloud-recommender' \
            'google-cloud-run' \
            'google-cloud-servicehealth' \
            'google-cloud-network-management' \
            'google-cloud-logging' \
            'google-cloud-resource-manager' \
            'graphviz' \
            'python-dotenv' \
            'markdown' \
            'google-api-python-client' \
            'mcp>=1.24.0,<2.0.0'

      - name: Generate and import every template permutation
        env:
          ADK_IMPORT_CHECK: '1'
          # Treat a skipped case as a failure: a skip validates nothing.
          ADK_IMPORT_STRICT: '1'
        run: npx vitest run tests/codegen/codegenMatrix.test.ts

